# ── Site ────────────────────────────────────────────────
title: BonniciLABS
description: "Digital forensics, network security, and the tools Norbert Bonnici builds along the way."
author: Norbert Bonnici
email: info@bonnicilabs.com
url: "https://bonnicilabs.com"
baseurl: ""
github_username: norbertbonnici
callsign: "9H"

# ── Collections ─────────────────────────────────────────
# Each file in _projects/ becomes a page at /projects/<name>/
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# ── Build ───────────────────────────────────────────────
markdown: kramdown
sass:
  style: compressed

exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - vendor
